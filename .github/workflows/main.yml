name: Latest logseq post workflow
on:
  push:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-notes:
    name: Update README with latest logseq notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: profile

      # Full history: the list is built from `git log`, which a shallow clone doesn't have.
      - uses: actions/checkout@v4
        with:
          repository: dino920135/Notes
          path: notes
          fetch-depth: 0

      - name: Update README list
        run: sh profile/.github/workflows/GetListInRepo.sh notes profile/README.md

      - uses: EndBug/add-and-commit@v9
        with:
          cwd: ./profile
          message: "Update readme with Github Action"
          default_author: github_actions
